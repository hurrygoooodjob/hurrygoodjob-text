<!doctype html><meta charset="utf-8"><title>v10 文字样式与渲染回归</title>
<style>body{font:15px system-ui;background:#e5e4d9;color:#29372b;margin:24px}h1{font-size:24px}.pass{color:#125423}.fail{color:#b00020}#views{display:flex;gap:12px;flex-wrap:wrap}figure{margin:0}canvas{width:225px;height:300px;background:#b6b6ae;border:1px solid #52604b}pre{white-space:pre-wrap;font-size:12px}</style>
<h1>v10 描边、发光、投影、透明度</h1><p>实际 Canvas 对照：文字独立于照片和 ASCII，效果保留主体前后遮挡。</p><div id="views"></div><ol id="results"></ol><pre id="report">运行中…</pre>
<script src="../src/model.js"></script><script src="../src/projection.js"></script><script src="../src/ring.js"></script><script src="../src/contour.js"></script><script src="../src/path.js"></script><script src="../src/renderer.js"></script>
<script>
(async()=>{'use strict';
const M=KineticModel,R=KineticRenderer,Ring=KineticRing,P=KineticProjection,results=[];
const canvas=(w=450,h=600)=>Object.assign(document.createElement('canvas'),{width:w,height:h});
const photo=canvas(900,1200),pc=photo.getContext('2d'),gradient=pc.createLinearGradient(0,0,900,1200);gradient.addColorStop(0,'#b9c8c1');gradient.addColorStop(.5,'#e9c09d');gradient.addColorStop(1,'#3d625f');pc.fillStyle=gradient;pc.fillRect(0,0,900,1200);pc.fillStyle='#38554a';pc.fillRect(340,250,230,800);
const mask=canvas(900,1200),mc=mask.getContext('2d');mc.fillStyle='#fff';mc.beginPath();mc.ellipse(450,600,120,420,0,0,Math.PI*2);mc.fill();
const fullMask=canvas(900,1200);fullMask.getContext('2d').fillRect(0,0,900,1200);
const base=M.normalize({customPath:[{x:.1,y:.3},{x:.3,y:.7},{x:.65,y:.25},{x:.9,y:.6}],width:900,height:1200,text:'TEXT IN SPACE',textColor:'#f6f4dc',size:78,font:'sans',backgroundMode:'image',imageWash:0,smallText:false,mode:'static',wrapRoll:-12,wrapTilt:-18,wrapPhase:25,depthFade:.3});
const pix=c=>c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,c.width,c.height).data;
function difference(a,b){let count=0,max=0,alpha=0;for(let i=0;i<a.length;i++){const d=Math.abs(a[i]-b[i]);if(d>1)count++;max=Math.max(max,d);if(i%4===3)alpha=Math.max(alpha,d);}return{count,max,alpha};}
function draw(doc,opts={}){const c=canvas(opts.width||450,opts.height||600),r=R.create(c);r.render(doc,0,[photo],{subjectMask:mask});const stats=r.stats;r.dispose();return{c,pixels:pix(c),stats};}
function assert(value,message){if(!value)throw Error(message);}
async function check(name,fn){try{const detail=await fn();results.push({name,pass:true,detail});}catch(e){results.push({name,pass:false,error:e.message});}const li=document.createElement('li');li.className=results.at(-1).pass?'pass':'fail';li.textContent=(results.at(-1).pass?'PASS ':'FAIL ')+name+(results.at(-1).detail?' · '+JSON.stringify(results.at(-1).detail):results.at(-1).error?' · '+results.at(-1).error:'');document.getElementById('results').append(li);}
function show(c,title){const f=document.createElement('figure'),label=document.createElement('figcaption');label.textContent=title;f.append(c,label);document.getElementById('views').append(f);}
const variants=[['描边',{textStrokeEnabled:true,textStrokeWidth:5,textStrokeColor:'#df5037'}],['外发光',{textGlowEnabled:true,textGlow:24,textGlowColor:'#cbff72'}],['投影',{textShadowEnabled:true,textShadowBlur:16,textShadowX:20,textShadowY:16,textShadowOpacity:.9,textShadowColor:'#172b23'}],['透明度',{textOpacity:.35}]];
await check('13种文字效果均响应描边、外发光、投影及透明度',()=>{const checks=[];for(const template of R.templateIds){const original=draw({...base,template}).pixels;for(const [name,patch]of variants){const d=difference(original,draw({...base,template,...patch}).pixels);assert(d.count>10,template+' '+name+' 未改变文字');checks.push({template,style:name,changed:d.count});}}return{comparisons:checks.length,minimumChanged:Math.min(...checks.map(c=>c.changed))};});
await check('透明度0保留照片和ASCII，13种文字效果均无残留',()=>{let max=0;for(const template of R.templateIds){const doc={...base,template,asciiLayer:true,asciiGlow:false,asciiAnimate:false,asciiCoverage:74};const a=draw({...doc,textLayer:false}).pixels,b=draw({...doc,textOpacity:0,textStrokeEnabled:true,textGlowEnabled:true,textShadowEnabled:true}).pixels,d=difference(a,b);assert(d.max<=1,template+' opacity0污染背景 '+JSON.stringify(d));max=Math.max(max,d.max);}return{templates:13,maxRGBADifference:max};});
await check('无效果默认值与显式关闭四种样式一致',()=>{const a=draw(base).pixels,b=draw({...base,textOpacity:1,textStrokeEnabled:false,textGlowEnabled:false,textShadowEnabled:false}).pixels;const d=difference(a,b);assert(d.max<=1,JSON.stringify(d));return d;});
await check('每组字效独立，修改下方组不改动上方组',()=>{const doc={...base,wrapRoll:0,wrapTilt:0,depthFade:0};const groups=[M.makeGroup(doc,0,{id:'g1',text:'UPPER GROUP',offsetY:-.27,roll:0,tilt:0,size:54}),M.makeGroup(doc,1,{id:'g2',text:'LOWER GROUP',offsetY:.27,roll:0,tilt:0,size:54})];const a=draw({...doc,ringGroups:groups}),b=draw({...doc,ringGroups:[groups[0],{...groups[1],textStrokeEnabled:true,textStrokeWidth:7,textGlowEnabled:true,textGlow:20,textShadowEnabled:true,textShadowX:18,textOpacity:.45}]});const split=450*250*4,upper=difference(a.pixels.slice(0,split),b.pixels.slice(0,split)),lower=difference(a.pixels.slice(split),b.pixels.slice(split));if(upper.max>1){const changed=[];for(let i=0;i<split;i+=4)if(Math.max(...a.pixels.slice(i,i+3).map((v,k)=>Math.abs(v-b.pixels[i+k])))>1)changed.push({x:(i/4)%450,y:Math.floor(i/4/450),a:[...a.pixels.slice(i,i+4)],b:[...b.pixels.slice(i,i+4)]});show(a.c,'单组隔离：修改前');show(b.c,'单组隔离：修改后');throw Error('上方组变化 '+JSON.stringify({upper,bounds:{minX:Math.min(...changed.map(p=>p.x)),minY:Math.min(...changed.map(p=>p.y)),maxX:Math.max(...changed.map(p=>p.x)),maxY:Math.max(...changed.map(p=>p.y))},examples:changed.slice(0,5),diagnostics:{onlyOpacity:difference(a.pixels.slice(0,split),draw({...doc,ringGroups:[groups[0],{...groups[1],textOpacity:.45}]}).pixels.slice(0,split)),onlyStyles:difference(a.pixels.slice(0,split),draw({...doc,ringGroups:[groups[0],{...groups[1],textStrokeEnabled:true,textStrokeWidth:7,textGlowEnabled:true,textGlow:20,textShadowEnabled:true,textShadowX:18}]}).pixels.slice(0,split)),withoutLower:difference(a.pixels.slice(0,split),draw({...doc,ringGroups:[groups[0]]}).pixels.slice(0,split))},sameOptions:JSON.stringify(a.stats.wrap.groups[0].options)===JSON.stringify(b.stats.wrap.groups[0].options),sameQuads:JSON.stringify(a.stats.wrap.quads.filter(q=>q.group===0))===JSON.stringify(b.stats.wrap.quads.filter(q=>q.group===0))}));}assert(lower.count>100,'下方组无变化');assert(a.stats.wrap.groups[0].options.textOpacity===1&&b.stats.wrap.groups[1].options.textOpacity===.45,'组参数未独立');return{upper,lower};});
await check('透明度0的额外组不改变可见组顺序或画面',()=>{const group=M.makeGroup(base,0,{text:'VISIBLE GROUP'}),invisible=M.makeGroup(base,1,{text:'INVISIBLE GROUP',roll:37,offsetY:.12,textOpacity:0});const a=draw({...base,ringGroups:[group]}),b=draw({...base,ringGroups:[group,invisible]});const d=difference(a.pixels,b.pixels);assert(d.max<=1,JSON.stringify(d));assert(b.stats.wrap.hasTranslucentText===false,'完全透明组被误判为可见半透明组');return d;});
await check('描边/发光/投影与透明度仍受远侧主体遮挡',()=>{const options={width:900,height:1200,text:'BEHIND THE SUBJECT',fontSize:82,radiusX:320,radiusZ:195,ringCenterX:450,ringCenterY:600,tilt:-18,roll:-12,segments:5,depthFade:.4,textStrokeEnabled:true,textStrokeWidth:3,textGlowEnabled:true,textGlow:18,textShadowEnabled:true,textShadowBlur:14,textShadowX:15,textShadowY:12,textOpacity:.45,layers:{background:false}};const a=canvas(),b=canvas();Ring.render(a.getContext('2d'),fullMask,options);Ring.render(b.getContext('2d'),null,{...options,layers:{background:false,far:false,near:true,subject:false}});const d=difference(pix(a),pix(b));assert(d.max<=1,'被遮住的远侧字效污染近侧 '+JSON.stringify(d));return d;});
await check('整体文字透明度乘在最终文字层上，不累积笔画交叠',()=>{const doc={...base,template:'wave',backgroundMode:'none',textShadowEnabled:true,textShadowBlur:10,textGlowEnabled:true,textGlow:16,asciiLayer:false};const a=draw({...doc,textOpacity:1}).pixels,b=draw({...doc,textOpacity:.5}).pixels;let count=0,max=0;for(let i=3;i<a.length;i+=4){if(a[i]>0){max=Math.max(max,Math.abs(b[i]-a[i]*.5));count++;}}assert(count>100&&max<=1,'alpha不是一次合成 '+max);return{inkPixels:count,maxAlphaError:max};});
await check('高分辨率字效尺寸只缩放一次，不在底层再次截断',()=>{const s=P.normalizeOptions({width:3600,height:4800,textStyleScale:4,textStrokeEnabled:true,textStrokeWidth:12,textGlowEnabled:true,textGlow:40,textShadowEnabled:true,textShadowBlur:40,textShadowX:50,textShadowY:-50},900,1200);assert(s.textStrokeWidth===48&&s.textGlow===160&&s.textShadowBlur===160&&s.textShadowX===200&&s.textShadowY===-200,JSON.stringify(s));return{stroke:s.textStrokeWidth,glow:s.textGlow,shadow:s.textShadowBlur};});
await check('画布文字点选API和像素回读缓冲已移除',()=>{const c=canvas(),r=R.create(c),stats=r.render(base,0,[photo],{subjectMask:mask});assert(!('pickGroup'in r)&&!('groupTargets'in r)&&!('pickGroup'in stats.wrap)&&!('groupTargets'in stats.wrap),'存在旧点选入口');r.dispose();return{pickAPIs:0,pickRasterBuilds:stats.wrap.pickRasterBuilds||0};});
await check('实际PNG解码与预览相同，包含组合字效',async()=>{const styled={...base,textStrokeEnabled:true,textStrokeWidth:3,textGlowEnabled:true,textGlow:12,textShadowEnabled:true,textShadowBlur:10,textShadowX:8,textShadowY:10,textOpacity:.7};const a=draw(styled),image=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=a.c.toDataURL('image/png');});const b=canvas();b.getContext('2d').drawImage(image,0,0);const d=difference(a.pixels,pix(b));assert(d.max<=1,JSON.stringify(d));show(a.c,'组合字效 · 70%不透明度');return{width:image.naturalWidth,height:image.naturalHeight,difference:d};});
await check('3组样式与基础效果的热帧耗时记录',()=>{const c=canvas(),r=R.create(c),groups=[0,-.22,.22].map((offsetY,i)=>M.makeGroup(base,i,{offsetY,size:56,roll:[-12,16,-25][i],text:'TEXT GROUP '+(i+1),textGlowEnabled:true,textGlow:14,textStrokeEnabled:true,textStrokeWidth:2,textShadowEnabled:true,textShadowBlur:10,textShadowX:6,textShadowY:7,textOpacity:.65}));function bench(doc){r.render(doc,0,[photo],{subjectMask:mask});const times=[];for(let i=0;i<5;i++){const t=performance.now();r.render(doc,.1*i,[photo],{subjectMask:mask});times.push(performance.now()-t);}return{medianMs:times.sort((a,b)=>a-b)[2],maxMs:Math.max(...times)};}const ordinary=bench(base),styled=bench({...base,ringGroups:groups});show(c,'三组字效 · 独立旋转与透明度');r.dispose();return{canvas:'450×600',ordinary,styled};});
document.getElementById('report').textContent=JSON.stringify(results,null,2);document.title='v10 字效验收 '+results.filter(r=>r.pass).length+'/'+results.length;
})();
</script>
