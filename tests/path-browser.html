<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>v10 自定义路径实际 Canvas 验收</title>
<style>body{font:15px/1.6 system-ui;background:#e7e5d8;color:#29372c;margin:24px}h1{font-size:24px}.views{display:flex;flex-wrap:wrap;gap:16px}.views figure{margin:0;width:270px}canvas{width:100%;height:auto;border:1px solid #809176;border-radius:8px}li{margin:8px 0}.pass{color:#286522}.fail{color:#a02222}pre{white-space:pre-wrap;font-size:12px}</style>
<h1>手绘路径文字：实际 Canvas</h1><p>验证路径、正反动态、字效、ASCII独立性和PNG。只运行于测试页，不写编辑器草稿。</p><div id="views" class="views"></div><ol id="results"></ol><pre id="report">运行中</pre>
<script src="../src/model.js"></script><script src="../src/projection.js"></script><script src="../src/ring.js"></script><script src="../src/contour.js"></script><script src="../src/path.js"></script><script src="../src/renderer.js"></script><script src="../src/io.js"></script>
<script>
(async function(){
const K=KineticPath,M=KineticModel,R=KineticRenderer,IO=KineticIO,results=[];
const points=[{x:.12,y:.76},{x:.19,y:.36},{x:.4,y:.18},{x:.75,y:.26},{x:.82,y:.52},{x:.63,y:.77},{x:.35,y:.69},{x:.32,y:.48},{x:.55,y:.45}];
const photo=document.createElement('canvas');photo.width=450;photo.height=600;const pc=photo.getContext('2d');const grad=pc.createLinearGradient(0,0,450,600);grad.addColorStop(0,'#1d483f');grad.addColorStop(1,'#ac8b48');pc.fillStyle=grad;pc.fillRect(0,0,450,600);pc.fillStyle='#dad4ac';pc.beginPath();pc.ellipse(230,330,85,175,0,0,Math.PI*2);pc.fill();
const base=M.normalize({template:'customPath',mode:'static',text:'HURRY GOOD JOB · 自由路径 · ',customPath:points,width:900,height:1200,size:45,textColor:'#fff9ce',textLayer:true,pathRepeat:true,pathSpacing:3,backgroundMode:'image',imageWash:0,smallText:false,asciiLayer:false});
function draw(patch={},time=0){const c=document.createElement('canvas');c.width=450;c.height=600;const r=R.create(c),doc=M.normalize({...base,...patch});const stats=r.render(doc,time,[photo]);r.dispose();return{canvas:c,stats,doc};}
function pixels(c){return c.getContext('2d').getImageData(0,0,c.width,c.height).data;}
function diff(a,b){a=pixels(a);b=pixels(b);let count=0,max=0;for(let i=0;i<a.length;i++){const d=Math.abs(a[i]-b[i]);if(d){count++;max=Math.max(max,d);}}return{count,max};}
function assert(value,message){if(!value)throw Error(message);}
function show(c,label){const f=document.createElement('figure'),cap=document.createElement('figcaption');cap.textContent=label;f.append(c,cap);document.getElementById('views').append(f);}
async function check(name,fn){try{const detail=await fn();results.push({name,pass:true,detail});}catch(e){results.push({name,pass:false,error:e.message});}const r=results.at(-1),li=document.createElement('li');li.className=r.pass?'pass':'fail';li.textContent=(r.pass?'PASS ':'FAIL ')+name+(r.detail?' · '+JSON.stringify(r.detail):r.error?' · '+r.error:'');document.getElementById('results').append(li);}
await check('手绘路径生成真实文字，全部字形落在有限坐标内',()=>{const a=draw();show(a.canvas,'手绘路径 · 静态');const s=a.stats.customPath||a.stats.path;assert(s&&s.glyphCount>20,'custom path renderer not called');assert(s.glyphs.every(g=>Number.isFinite(g.x)&&Number.isFinite(g.y)&&Number.isFinite(g.angle)),'invalid glyph position');return{glyphCount:s.glyphCount,pathLength:s.pathLength};});
await check('静态路径与零速动态不随时间漂移',()=>{const a=draw({},0),b=draw({},8),c=draw({mode:'motion',speed:0},0),d=draw({mode:'motion',speed:0},8);assert(diff(a.canvas,b.canvas).count===0,'static drift');assert(diff(c.canvas,d.canvas).count===0,'zero speed drift');return{staticDifference:0,zeroSpeedDifference:0};});
await check('正向反向运动产生不同帧，字符方向不翻转',()=>{const common={mode:'motion',customPath:[{x:.08,y:.5},{x:.92,y:.5}],pathRepeat:false,pathPhase:35,text:'FORWARD',size:36};const a=draw(common,0),f=draw(common,.5),b=draw({...common,pathDirection:'reverse'},.5);show(f.canvas,'正向动态时刻');const sa=a.stats.customPath||a.stats.path,sf=f.stats.customPath||f.stats.path,sb=b.stats.customPath||b.stats.path;assert(sf.glyphs[0].x>sa.glyphs[0].x&&sb.glyphs[0].x<sa.glyphs[0].x,'direction/clock mismatch');assert(sf.glyphs[0].angle===sb.glyphs[0].angle,'reverse flipped letters');assert(diff(a.canvas,f.canvas).count>100,'no movement');return{start:sa.glyphs[0].x,forward:sf.glyphs[0].x,reverse:sb.glyphs[0].x};});
await check('空路径不生成默认线条或文字，照片仍在',()=>{const a=draw({customPath:[]}),b=draw({textLayer:false});assert(diff(a.canvas,b.canvas).count===0,'empty path manufactured output');return{pixelDifference:0};});
await check('描边、外发光、投影分别作用于自定义路径',()=>{const a=draw(),changes={};for(const [name,patch]of Object.entries({stroke:{textStrokeEnabled:true,textStrokeWidth:5,textStrokeColor:'#fd3853'},glow:{textGlowEnabled:true,textGlow:30,textGlowColor:'#2bffbd'},shadow:{textShadowEnabled:true,textShadowBlur:16,textShadowX:18,textShadowY:20,textShadowOpacity:.8}})){const b=draw(patch),d=diff(a.canvas,b.canvas);assert(d.count>200,name+' not visible');changes[name]=d.count;}show(draw({textStrokeEnabled:true,textStrokeWidth:2,textGlowEnabled:true,textGlow:14,textShadowEnabled:true,textOpacity:.6}).canvas,'组合字效 · 60%不透明度');return changes;});
await check('文字完全透明后照片和ASCII逐像素保留',()=>{const a=draw({asciiLayer:true,textOpacity:0}),b=draw({asciiLayer:true,textLayer:false});const d=diff(a.canvas,b.canvas);assert(d.count===0,'opacity changed photo or ASCII');return d;});
await check('闭合路径接缝连续，长文动画最终显示尾字',()=>{const loop=[{x:.25,y:.3},{x:.55,y:.28},{x:.65,y:.5},{x:.4,y:.6}];const p=K.prepare(loop,900,1200,true);assert(p.closed&&p.points.length>4,'not closed');assert(Math.hypot(p.points[0].x-p.points.at(-1).x,p.points[0].y-p.points.at(-1).y)<1e-8,'seam gap');const c=document.createElement('canvas');c.width=450;c.height=600;const cx=c.getContext('2d');let tail=false;for(let t=0;t<20;t+=.25){const s=K.render(cx,{points:loop,width:900,height:1200,closed:true,repeat:false,text:'A'.repeat(80)+'Z',fontSize:45,motion:true,speed:100,time:t,color:'#ffffff'});if(s.glyphs.some(g=>g.char==='Z')){tail=true;break;}}assert(tail,'tail of long closed phrase never appears');return{closed:true,tailVisible:true};});
await check('工程保存往返保留路径、闭合、方向和起点',()=>{const input=M.normalize({...base,pathClosed:true,pathDirection:'reverse',pathPhase:37,pathRepeat:false});const restored=IO.parse(IO.serialize(input));assert(JSON.stringify(restored.customPath)===JSON.stringify(input.customPath),'points lost');for(const k of ['pathClosed','pathDirection','pathPhase','pathRepeat'])assert(restored[k]===input[k],k+' lost');const a=draw(input),b=draw(restored);assert(diff(a.canvas,b.canvas).count===0,'restored output differs');return{points:restored.customPath.length,schema:JSON.parse(IO.serialize(input)).version};});
await check('实际PNG编码解码与路径字效预览一致',async()=>{const a=draw({textStrokeEnabled:true,textGlowEnabled:true,textShadowEnabled:true,textOpacity:.55});const blob=await new Promise(resolve=>a.canvas.toBlob(resolve,'image/png'));const url=URL.createObjectURL(blob),img=new Image();img.src=url;await img.decode();const b=document.createElement('canvas');b.width=img.naturalWidth;b.height=img.naturalHeight;b.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(url);const d=diff(a.canvas,b);assert(d.count===0,'PNG mismatch');return{width:b.width,height:b.height,difference:d};});
await check('连续动画帧复用路径与字体测量，字形缓存受像素预算约束',()=>{K.clearCaches();const c=document.createElement('canvas');c.width=450;c.height=600;const cx=c.getContext('2d'),options={points,width:900,height:1200,text:'CACHE · 缓存 ',fontSize:42,color:'#ffffff',textGlowEnabled:true,textGlow:14,textGlowColor:'#33ffaa',motion:true,speed:48,repeat:true};for(let i=0;i<30;i++)K.render(cx,{...options,time:i/30});const d=K.diagnostics();assert(d.geometryBuilds===1&&d.measurementBuilds===1,'rebuilt geometry or measured moving frames');assert(d.glyphPixels<=4*1024*1024,'unbounded texture cache');return d;});
document.getElementById('report').textContent=JSON.stringify(results,null,2);document.title='v10 路径验收 '+results.filter(r=>r.pass).length+'/'+results.length;
})();
</script></html>
