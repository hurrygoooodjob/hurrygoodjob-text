<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v07 路径与多组实际像素验收</title><style>body{background:#e6e4dc;color:#263027;font:15px/1.6 system-ui;margin:24px}h1{font-size:24px}.pass{color:#275f26}.fail{color:#ae2929}#views{display:flex;flex-wrap:wrap;gap:16px}figure{margin:0}canvas{width:270px;height:360px;background:#dededb;display:block}pre{white-space:pre-wrap}figcaption{max-width:270px}</style><h1>v07 路径与多组：实际 Canvas</h1><ol id="results"></ol><div id="views"></div><pre id="summary">运行中…</pre>
<script src="../src/model.js"></script><script src="../src/projection.js"></script><script src="../src/ring.js"></script><script src="../src/contour.js"></script><script src="../src/path.js"></script><script src="../src/renderer.js"></script><script src="../src/subject.js"></script><script>
(async()=>{const records=[],results=document.querySelector('#results'),summary=document.querySelector('#summary');const c=(w=360,h=480)=>Object.assign(document.createElement('canvas'),{width:w,height:h});const pixels=x=>x.getContext('2d').getImageData(0,0,x.width,x.height).data;const equal=(a,b)=>a.length===b.length&&a.every((x,i)=>x===b[i]);const assert=(v,m)=>{if(!v)throw Error(m)};const check=(name,fn)=>{const li=document.createElement('li');try{const detail=fn();li.className='pass';li.textContent='PASS '+name+(detail?' · '+detail:'');records.push({name,pass:true,detail});}catch(e){li.className='fail';li.textContent='FAIL '+name+' · '+e.message;records.push({name,pass:false,error:e.message});}results.append(li)};const image=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
try {const photo=await image('../assets/sample.png');const base=KineticModel.normalize({text:'MAKE SOMETHING GOOD •',size:46,width:900,height:1200,textColor:'#13291f',wrapTilt:-12,wrapRoll:0,wrapRadius:.37,wrapDepth:.22,wrapY:.52,backgroundMode:'image'});const source=c(600,800);KineticRenderer.composePhotos(source,base,[photo],{transparent:true});const extraction=await KineticSubject.fromAlpha(source);assert(extraction,'示例无有效主体 alpha');const mask=await image(extraction.dataURL);
const groups=[{text:'HURRY GOOD JOB •',color:'#13291f',offsetY:-.24,radiusScale:.9,phase:0},{text:'MAKE SOMETHING GOOD •',color:'#243327',offsetY:0,radiusScale:1,phase:0},{text:'YOUR WORDS GO HERE •',color:'#35442b',offsetY:.24,radiusScale:1.05,phase:0}];
function render(state,canvas=c(),m=mask){const r=KineticRenderer.create(canvas);r.render({...base,...state},0,[photo],{subjectMask:m});const stats=r.stats;return {canvas,stats};}
for(const [template,title,patch]of [['contour','沿真实轮廓 · 双道文字',{size:26,contourCount:2,contourGap:.018,contourSpacing:.042}],['spiral','平面连续螺旋',{size:43,spiralTurns:3,wrapRadius:.40,wrapY:.34,font:'serif',fontWeight:400}],['helix','立体螺旋 · 前后穿插',{size:44,wrapTurns:3,wrapHeight:.82}],['wrap','三组独立环绕 · 深度明暗',{ringGroups:groups,size:46}]]){const out=render({template,...patch}),fig=document.createElement('figure'),cap=document.createElement('figcaption');cap.textContent=title;fig.append(out.canvas,cap);document.querySelector('#views').append(fig);check(title,()=>{const s=template==='contour'||template==='spiral'?out.stats.contour:out.stats.wrap;assert(s,'渲染统计缺失');assert(!s.waiting,'没有生成文字');return JSON.stringify(s,(k,v)=>['quads','options','paths','points','vertices','glyphs','layers'].includes(k)?undefined:v).slice(0,500)});}
check('多组独立文字改变输出，隐藏主体仅影响远侧',()=>{const a=render({template:'wrap',ringGroups:groups}),b=render({template:'wrap',ringGroups:groups.map((g,i)=>i===1?{...g,text:'SECOND GROUP CHANGED',color:'#ff2020'}:g)});assert(!equal(pixels(a.canvas),pixels(b.canvas)),'第二组修改未影响输出');const n=render({template:'wrap',ringGroups:groups},c(),null);assert(!equal(pixels(a.canvas),pixels(n.canvas)),'蒙版没有遮挡作用');});
check('深度强弱对黑色和白色文字都产生可见变化',()=>{for(const textColor of ['#000000','#ffffff']){const a=render({template:'wrap',textColor,depthFade:0}),b=render({template:'wrap',textColor,depthFade:1});let diff=0;const ap=pixels(a.canvas),bp=pixels(b.canvas);for(let i=0;i<ap.length;i+=4)if(Math.abs(ap[i]-bp[i])+Math.abs(ap[i+1]-bp[i+1])+Math.abs(ap[i+2]-bp[i+2])>20)diff++;assert(diff>100,textColor+' 深度色差不足 '+diff);}return '黑/白两种文字均产生 >100 个明显变色像素';});
check('全主体蒙版下多组和螺旋的近侧逐像素保留',()=>{const opaque=c();opaque.getContext('2d').fillRect(0,0,360,480);for(const path of ['ellipse','helix']){const opts={...base,text:'DEPTH CHECK',width:900,height:1200,fontSize:50,path,turns:3,helixHeight:850,depthFade:.7,radiusX:300,radiusZ:180,ringCenterX:450,ringCenterY:600,groups:groups.map(g=>({text:g.text,textColor:g.color,ringCenterY:600+g.offsetY*1200})),layers:{background:false}};const a=c(),b=c();KineticRing.render(a.getContext('2d'),opaque,opts);KineticRing.render(b.getContext('2d'),null,{...opts,layers:{background:false,far:false}});const ap=pixels(a),bp=pixels(b);let n=0,max=0,alpha=0,coords=[];for(let i=0;i<ap.length;i++){if(ap[i]!==bp[i]){n++;max=Math.max(max,Math.abs(ap[i]-bp[i]));if(i%4===3){alpha++;if(coords.length<10)coords.push([Math.floor(i/4)%360,Math.floor(i/4/360),ap[i],bp[i]]);}}}assert(n===0,path+' 遮挡差异字节 '+n+' 最大差 '+max+' alpha '+alpha+' coords '+JSON.stringify(coords));}});
check('缺少蒙版时轮廓不假造主体边缘',()=>{const out=render({template:'contour'},c(),null);assert(out.stats.contour.waiting===true,'缺少等待提示');});
check('预览与同尺寸PNG渲染路径一致，静态螺旋不随时间变化',()=>{for(const template of ['contour','spiral','helix','wrap']){const s={...base,template,ringGroups:groups,size:40},a=c(),b=c(),r1=KineticRenderer.create(a),r2=KineticRenderer.create(b);r1.render(s,0,[photo],{subjectMask:mask});r2.render(s,2,[photo],{subjectMask:mask});assert(equal(pixels(a),pixels(b)),template+' 静态画面漂移');const encoded=a.toDataURL('image/png');assert(encoded.startsWith('data:image/png;base64,'),'PNG未生成');}});
}catch(e){records.push({name:'fixture setup',pass:false,error:e.message});results.textContent+='ERROR '+e.message;}
summary.textContent=JSON.stringify(records,null,2);summary.dataset.result=records.every(r=>r.pass)?'passed':'failed';})();
</script></html>
