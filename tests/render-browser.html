<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v07 实际渲染验收</title><style>body{font:15px/1.6 system-ui;background:#eeeee5;color:#232b23;padding:20px}li{margin:8px 0}.pass{color:#205c2d}.fail{color:#a12424}canvas{max-width:260px;border:1px solid #777;margin:8px}pre{white-space:pre-wrap}</style><h1>v07 实际 Canvas 验收</h1><p>在浏览器中执行照片合成、三维前后遮挡和模板兼容测试。</p><ol id="results"></ol><div id="views"></div><pre id="summary">运行中…</pre><script src="../src/model.js"></script><script src="../src/projection.js"></script><script src="../src/ring.js"></script><script src="../src/contour.js"></script><script src="../src/path.js"></script><script src="../src/renderer.js"></script><script>
'use strict';
const results=document.getElementById('results'),summary=document.getElementById('summary');let pass=0,fail=0;
const canvas=(w=180,h=240)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const rgba=c=>c.getContext('2d').getImageData(0,0,c.width,c.height).data;
const eq=(a,b)=>a.length===b.length&&a.every((v,i)=>v===b[i]);
const assert=(v,m)=>{if(!v)throw Error(m);};
function check(name,fn){const li=document.createElement('li');try{const detail=fn();li.className='pass';li.textContent='PASS '+name+(detail?' · '+detail:'');pass++;}catch(e){li.className='fail';li.textContent='FAIL '+name+' · '+e.message;fail++;console.error(e);}results.append(li);}
const photos=Array.from({length:9},(_,i)=>{const c=canvas(120,160),x=c.getContext('2d');x.fillStyle=`hsl(${i*40} 75% 50%)`;x.fillRect(0,0,120,160);x.fillStyle='#fff';x.font='bold 42px sans-serif';x.fillText(String(i+1),40,90);return c;});
const base=KineticModel.normalize({customPath:[{x:.1,y:.3},{x:.3,y:.7},{x:.65,y:.25},{x:.9,y:.6}],backgroundMode:'image',textLayer:false,imageWash:0,width:900,height:1200});
check('63种数量/比例的正式照片层与主体识别输入完全一致',()=>{let n=0;for(const [w,h]of[[1,1],[3,4],[4,3],[9,16],[16,9],[3,2],[2,3]])for(let count=1;count<=9;count++){const c=canvas(w*20,h*20),d=canvas(w*20,h*20),s={...base,width:w*120,height:h*120};const r=KineticRenderer.create(c);r.render(s,0,photos.slice(0,count));KineticRenderer.composePhotos(d,s,photos.slice(0,count));assert(eq(rgba(c),rgba(d)),`${count} 张 ${w}:${h} 像素不同`);r.dispose();n++;}return n+' 组像素逐一相同';});
const opts={width:900,height:1200,text:'AROUND YOU • AROUND YOU •',fontSize:64,textColor:'#fff',radiusX:360,radiusZ:198,ringCenterX:450,ringCenterY:570,phase:0,tilt:-18,segments:5,layers:{background:false}};
const full=canvas(360,480),near=canvas(360,480),far=canvas(360,480),masked=canvas(360,480),opaque=canvas(360,480);
opaque.getContext('2d').fillRect(0,0,360,480);
KineticRing.render(full.getContext('2d'),null,opts);KineticRing.render(near.getContext('2d'),null,{...opts,layers:{background:false,far:false}});KineticRing.render(far.getContext('2d'),null,{...opts,layers:{background:false,near:false}});KineticRing.render(masked.getContext('2d'),opaque,opts);
check('全主体遮罩只去掉远侧文字，近侧文字逐像素不变',()=>{assert(eq(rgba(near),rgba(masked)),'近侧与全遮罩结果不同');let changes=0;const f=rgba(full),n=rgba(near);for(let i=3;i<f.length;i+=4)if(f[i]!==n[i])changes++;assert(changes>100,'缺少可验证的远侧文字');return changes+' 个远侧像素受遮挡';});
check('柔边遮罩合成符合独立的Alpha公式',()=>{const m=canvas(360,480),mc=m.getContext('2d'),g=mc.createLinearGradient(130,0,240,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,1)');mc.fillStyle=g;mc.fillRect(0,0,360,480);const actual=canvas(360,480);KineticRing.render(actual.getContext('2d'),m,opts);const a=rgba(actual),f=rgba(far),n=rgba(near),ma=rgba(m);let max=0,samples=0;for(let i=3;i<a.length;i+=4){const af=f[i]/255*(1-ma[i]/255),an=n[i]/255,expected=(an+af*(1-an))*255;max=Math.max(max,Math.abs(a[i]-expected));if(f[i]>10&&ma[i]>5&&ma[i]<250)samples++;}assert(samples>100,'缺少柔边重叠样本');assert(max<=2,'Alpha误差 '+max);return samples+' 柔边样本，最大误差 '+max.toFixed(2);});
check('13个文字效果与ASCII均能使用9张照片渲染',()=>{for(const t of KineticModel.TEMPLATES){const c=canvas(),r=KineticRenderer.create(c);r.render({...base,textLayer:true,asciiLayer:true,asciiCoverage:80,template:t.id,mode:'motion',text:'HURRY TEXT',size:54},1,photos);assert(r.stats.compositeImages===9,t.id+' 未使用9张图');assert(rgba(c).some((v,i)=>i%4===3&&v>0),t.id+' 输出为空');r.dispose();}return '13种效果通过';});
check('静态环绕保持当前相位，动态环绕随时间变化',()=>{const a=canvas(),b=canvas(),r1=KineticRenderer.create(a),r2=KineticRenderer.create(b),state={...base,template:'wrap',textLayer:true,text:'AROUND YOU • AROUND YOU •',size:64,mode:'static'};r1.render(state,0,photos.slice(0,1));r2.render(state,1,photos.slice(0,1));assert(eq(rgba(a),rgba(b)),'静态状态时间改变了画面');r2.render({...state,mode:'motion'},1,photos.slice(0,1));assert(!eq(rgba(a),rgba(b)),'动态状态未改变画面');r1.dispose();r2.dispose();});
check('真实透明像素在无底色照片合成中保留',()=>{const source=canvas(120,160),s=source.getContext('2d');s.fillStyle='#f80';s.fillRect(40,30,40,100);const out=canvas(),flat=canvas();KineticRenderer.composePhotos(out,base,[source],{transparent:true});KineticRenderer.composePhotos(flat,base,[source]);assert(rgba(out)[3]===0,'透明像素丢失');assert(rgba(flat)[3]===255,'默认背景没有填充');});
const view=canvas(360,480),vr=KineticRenderer.create(view);vr.render({...base,template:'wrap',textLayer:true,text:'AROUND YOU • AROUND YOU •',size:64},0,photos);view.setAttribute('aria-label','9张图与三维环绕实际输出');document.getElementById('views').append(view,full,masked);summary.textContent=`${pass} 项通过 / ${fail} 项失败`;summary.dataset.result=fail?'failed':'passed';
</script></html>
